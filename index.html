    <!-- Critical CSS inlined to prevent render blocking on the above-the-fold area -->
    <style>

    </style>

    <!-- Google tag (gtag.js) - GA4 + Ads — deferred until after load to keep main thread free -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      function loadGtag(){
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-SH3LD2LH6J';
        document.head.appendChild(s);
        gtag('config', 'G-SH3LD2LH6J', { 'transport_type': 'beacon' });
        gtag('config', 'AW-18016443240', { 'allow_enhanced_conversions': true });
        gtag('set', 'allow_enhanced_conversions', true);
      }
      if (document.readyState === 'complete') {
        setTimeout(loadGtag, 1500);
      } else {
        window.addEventListener('load', function(){ setTimeout(loadGtag, 1500); });
      }
      // Also load on first user interaction (whichever comes first)
      ['scroll','mousemove','touchstart','keydown'].forEach(function(e){
        window.addEventListener(e, loadGtag, { once: true, passive: true });
      });
    </script>
